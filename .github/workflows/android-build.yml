name: Build APK From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt update && sudo apt install unzip -y

      - name: Extract ZIP
        run: |
          unzip -o "MCPELibImporter-source.zip" -d extracted

      - name: Find project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle Wrapper 8.2
        run: |
          mkdir -p $PROJECT_DIR/gradle/wrapper

          cat > $PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties << EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          EOF

          cd $PROJECT_DIR

          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip gradle-8.2-bin.zip
          chmod +x gradle-8.2/bin/gradle

      - name: Build APK
        run: |
          cd $PROJECT_DIR

          chmod +x gradlew || true

          ./gradle-8.2/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCPELibImporter-APK
          path: extracted/**/build/outputs/apk/**/*.apk
