name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Force Gradle 8.4
        run: |
          mkdir -p "$PROJECT_DIR/gradle/wrapper"

          cat > "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" << EOF
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
EOF

      - name: Create gradlew if missing
        run: |
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            cat > "$PROJECT_DIR/gradlew" << 'EOF'
#!/bin/bash
DIR="$( cd "$( dirname "$0" )" && pwd )"
java -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
EOF
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Enable AndroidX
        run: |
          touch "$PROJECT_DIR/gradle.properties"

          grep -q "android.useAndroidX" "$PROJECT_DIR/gradle.properties" || \
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

          grep -q "android.enableJetifier" "$PROJECT_DIR/gradle.properties" || \
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Fix launcher icon XML
        run: |
          find "$PROJECT_DIR" -name "ic_launcher_foreground.xml" -type f | while read file; do
            echo "Fixing $file"

            cat > "$file" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">

    <path
        android:fillColor="#3DDC84"
        android:pathData="M20,20h68v68h-68z"/>
</vector>
EOF
          done

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
